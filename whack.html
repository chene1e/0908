<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>群友打地鼠 · PIXEL FRIENDS ARCADE</title><link rel="stylesheet" href="whack.css?v=20261022-audio1"><script src="config.js?v=20261022-stop1"></script></head><body><main class="arcade"><a class="back-link" href="index.html">← 返回游戏库</a><header class="arcade-header"><div class="eyebrow">PIXEL FRIENDS ARCADE</div><h1>群友打地鼠</h1><p>选一个最想打的，其他群友也会随机冒头！</p><button id="audioToggle" class="audio-toggle" type="button" aria-pressed="true">♫ 背景音乐：开</button></header><section id="setup" class="panel"><h2>🎯 选择最想打的群友</h2><p class="muted">重点目标出现概率约 40%，其他群友也会出场。</p><div id="targetPicker" class="target-picker"></div><label class="name-label" for="playerName">你的群昵称</label><input id="playerName" maxlength="40" placeholder="输入昵称参加排行榜" autocomplete="nickname"><div class="setup-actions"><button id="startGame" class="primary">准备开打</button><button id="showLeaderboard" class="secondary">🏆 群友排行榜</button></div><p class="small-note">直接使用游戏库现有头像，并在浏览器中自动像素化，无需重新上传。</p></section><section id="game" class="hidden"><div class="hud"><div><span>剩余时间</span><strong id="time">30</strong><small>秒</small></div><div><span>当前得分</span><strong id="score">0</strong></div><div><span>最高连击</span><strong id="combo">0</strong></div></div><div id="targetBanner" class="target-banner"></div><div class="board-wrap"><div id="board" class="board"></div><div id="countdown" class="countdown hidden">3</div><div id="resultOverlay" class="result-overlay hidden"><div class="result-card"><div class="eyebrow">GAME OVER</div><h2 id="resultTitle">本局结算</h2><div class="final-score"><span id="finalScore">0</span><small>分</small></div><p id="resultSubtitle"></p><div class="stats-grid"><div><span>成功命中</span><strong id="finalHits">0</strong></div><div><span>最高连击</span><strong id="finalCombo">0</strong></div><div><span>炸弹误触</span><strong id="finalBombs">0</strong></div><div><span>命中准确率</span><strong id="finalAccuracy">100%</strong></div></div><p id="saveStatus" class="save-status">正在保存成绩…</p><button id="playAgain" class="primary">再来一局</button><button id="backSetup" class="secondary">换个重点目标</button></div></div></div><div class="game-footer"><span id="comboMessage">准备好了吗？</span><span>普通 +1 · 皇冠 +3 · 墨镜 +5 · 炸弹 −2</span></div></section><section id="leaderboard" class="panel hidden"><div class="leader-head"><button id="leaderBack" class="back-small">← 返回</button><h2>🏆 群友打地鼠排行榜</h2></div><p id="leaderStatus" class="muted">正在读取云端成绩…</p><ol id="leaderList" class="leader-list"></ol><button id="refreshLeaderboard" class="secondary">刷新排行榜</button></section><footer>兄弟姐妹全上岸游戏库 · 祝你手速起飞</footer></main><script src="whack.js?v=20261022-audio1"></script></body></html>
