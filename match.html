<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f2e9">
<title>群友消消乐</title><link rel="stylesheet" href="match.css?v=20261022-fix2">
</head>
<body>
<main class="match-app">
  <a class="back-link" href="index.html">← 返回游戏库</a>
  <section id="gameCover" class="game-cover">
    <p class="eyebrow">GROUP FRIENDS MATCH</p>
    <h1>群友消消乐</h1>
    <p class="cover-subtitle">一分钟限时挑战！交换头像，凑齐三个相同的群友。</p>
    <div class="cover-rules"><span>⏱️ 60 秒</span><span>✨ 三消得分</span><span>🏆 冲击排行榜</span></div>
    <button id="startGame" class="start-game" type="button">开始游戏</button>
    <a class="ranking-open" href="ranking.html?v=20261022-fix2">🏆 查看排行榜</a>
  </section>
  <section id="gameArea" class="game-area hidden">
    <header class="hero"><p class="eyebrow">GROUP FRIENDS MATCH</p><h1>群友消消乐</h1><p>交换头像，凑齐三个相同的群友！</p></header>
    <section class="scorebar" aria-label="游戏数据">
      <div><span>当前分数</span><strong id="score">0</strong></div>
      <div><span>剩余时间</span><strong id="timeLeft">60</strong></div>
      <div><span>目标分数</span><strong id="target">1500</strong></div>
    </section>
    <div class="progress-track"><span id="progress"></span></div>
    <section class="game-shell">
      <div class="board-top"><span id="message" role="status" aria-live="polite">交换相邻头像，凑齐三个即可消除</span><button id="endGame" type="button">提前结束</button></div>
      <div id="board" class="board" role="grid" aria-label="群友消消乐棋盘"></div>
    </section>
  </section>
  <div id="result" class="result hidden" role="dialog" aria-modal="true" aria-labelledby="resultTitle"><div class="result-card"><div id="resultEmoji" class="result-emoji">🏁</div><h2 id="resultTitle">本局结束</h2><p id="resultText"></p><button id="playAgain" type="button">再来一局</button><a id="backToCover" href="#">返回封面</a></div></div>
</main>
<script src="identity.js?v=20261023-v1"></script>
<script src="match.js?v=20261023-identity1"></script>
</body></html>
